<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKELM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        video {
            width: 100%;
            height: 100vh;
            object-fit: contain; /* Fits video perfectly without cropping */
            max-width: 100%;
            max-height: 100%;
        }
        
        /* Mobile optimization - fills screen perfectly */
        @media (max-aspect-ratio: 9/16) {
            video {
                width: 100vw;
                height: auto;
            }
        }
        
        /* Desktop - centers with black letterboxing */
        @media (min-aspect-ratio: 16/9) {
            video {
                width: auto;
                height: 100vh;
            }
        }
    </style>
</head>
<body>
    <video 
        src="darbyskelm.mp4" 
        muted 
        controls
        playsinline
        preload="metadata">
        Your consciousness requires optimization to view this content.
    </video>
</body>
</html>
