<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>On Sanity</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #0b0c10;
      color: #66fcf1;
      font-family: 'Courier New', monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      animation: glitch 1.5s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 red; }
      25% { text-shadow: -2px 0 lime; }
      50% { text-shadow: 2px 2px blue; }
      75% { text-shadow: -1px -1px magenta; }
      100% { text-shadow: 0 0 white; }
    }

    video {
      max-width: 100%;
      max-height: 80vh;
      border: 2px solid #66fcf1;
      border-radius: 8px;
    }

    .noise {
      font-size: 0.75rem;
      margin-top: 1rem;
      opacity: 0.3;
      user-select: none;
    }
  </style>
</head>
<body>
  <h1>Is it hot in here? Or is it just my refurbished laptop trying to download the Declaration of Independence?</h1>

  <video controls autoplay muted>
    <source src="darbyskelm.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <div class="noise">:: PRESS PLAY TO HEAR WHAT THEY WON'T TELL YOU IN SCHOOLS ::</div>
</body>
</html>
